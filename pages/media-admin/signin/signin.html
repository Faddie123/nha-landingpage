<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NHA Media Admin Sign In | Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="signin.css">
</head>
<body>
  <main class="signin-card">
    <a class="brand" href="../../../index.html">
      <img src="../../../assets/images/shared/branding/nha-logo-footer.png" alt="NHA logo">
      <span><strong>NHA Media</strong><small>National Highway Authority</small></span>
    </a>
    <div class="signin-heading">
      <p class="eyebrow">Media administration</p>
      <h1>Welcome back</h1>
      <p>Sign in to manage Media Center news, photos, videos and documents.</p>
    </div>
    <form id="mediaSigninForm">
      <div class="field">
        <label for="mediaEmail">Email address</label>
        <input id="mediaEmail" name="email" type="email" autocomplete="username" placeholder="name@nha.gov.pk" required>
      </div>
      <div class="field">
        <label for="mediaPassword">Password</label>
        <input id="mediaPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter any password for demo" required>
      </div>
      <button type="submit">Sign in to Media Admin</button>
    </form>
    <p class="demo-hint"><strong>Demo mode:</strong> any valid email and password will open the Media Admin. This page does not authenticate users or connect to a server.</p>
  </main>
  <script src="signin.js"></script>
</body>
</html>
